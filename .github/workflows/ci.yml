name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned pnpm, Node, and dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          runtime: node@20.19.5
          cache: true
          require-lockfile: true

      - name: Check peer dependency contracts
        run: pnpm peers check

      - name: Run static, unit, integration, and build gate
        run: pnpm quality

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run production browser gate
        run: pnpm test:e2e
