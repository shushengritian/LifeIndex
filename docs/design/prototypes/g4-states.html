<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>LifeIndex · 交付状态审稿</title>
    <link rel="stylesheet" href="g3-ocean.css" />
    <link rel="stylesheet" href="g4-states.css" />
    <script src="g4-states.js" defer></script>
  </head>
  <body>
    <main>
      <header class="pagehead">
        <h1>安心记录</h1>
        <button id="theme" class="iconbtn" aria-label="切换深浅主题">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="8" />
            <path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" />
          </svg>
        </button>
      </header>
      <p class="intro">离线与更新的交互审稿。所有结果都是内存演示，不更新应用、不写入真实记录。</p>
      <section aria-labelledby="network-title">
        <h2 id="network-title">连接状态</h2>
        <div id="network-status" class="notice" role="status"></div>
        <button id="network-toggle" class="subtle-button">模拟断网</button>
      </section>
      <section aria-labelledby="update-title">
        <div class="sectionhead">
          <h2 id="update-title">应用更新</h2>
          <span class="badge">交互样本</span>
        </div>
        <div id="update-status" role="status"></div>
        <div class="actions">
          <button id="update" class="primary">现在更新</button
          ><button id="later" class="secondary">稍后再说</button>
        </div>
        <details class="test-tools">
          <summary>更新验证工具</summary>
          <label><input id="dirty" type="checkbox" /> 有未保存草稿</label
          ><label><input id="saving" type="checkbox" /> 记录正在保存</label
          ><label><input id="update-fail" type="checkbox" /> 下一次更新失败</label
          ><button id="update-reset" class="subtle-button">重新显示更新提示</button>
        </details>
      </section>
      <footer>
        <a href="g4-review.html#delivery">返回整体审稿</a>
        <p>刷新会重置样本。真实离线缓存、更新激活在生产开发阶段验证。</p>
      </footer>
    </main>
  </body>
</html>
