<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>LifeIndex · 隔离交互原型</title>
    <link rel="stylesheet" href="app.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <main id="screen" tabindex="-1"></main>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <nav id="nav" aria-label="主导航"></nav>
    </div>
    <dialog id="editor" class="sheet" aria-labelledby="editor-title">
      <form id="editor-form" novalidate></form>
    </dialog>
    <dialog id="confirmation" class="confirmation" aria-labelledby="confirm-title"></dialog>
  </body>
</html>
