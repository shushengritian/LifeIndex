<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; frame-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>LifeIndex · 全应用操作设计稿</title>
    <link rel="stylesheet" href="app.css" />
    <script defer src="review.js"></script>
  </head>
  <body class="review-shell">
    <aside class="review-tools" aria-label="独立审稿工具">
      <div class="review-intro">
        <strong>LifeIndex</strong><span>操作设计稿 · 合成数据 · 刷新重置</span>
      </div>
      <details id="review-options">
        <summary>审稿工具</summary>
        <div class="review-controls">
          <label
            >主题<select id="review-theme">
              <option value="dark">深海蓝</option>
              <option value="light">雾蓝白</option>
            </select></label
          >
          <label
            >样本<select id="review-state">
              <option value="sample">日常样本</option>
              <option value="empty">全空状态</option>
              <option value="long">长内容样本</option>
            </select></label
          >
          <button id="review-reset" type="button">重置样本</button>
          <button id="review-failure" type="button">下一次保存失败</button>
          <button id="review-finish" type="button">计时推进至结束</button>
          <p id="review-status" role="status">
            所有操作仅在隔离内存中模拟。无网络请求、无存储、无文件读写。
          </p>
        </div>
      </details>
    </aside>
    <!-- The opaque sandbox denies storage access; no same-origin or download capability is granted. -->
    <iframe
      id="prototype"
      title="LifeIndex 交互原型"
      sandbox="allow-scripts allow-forms"
      src="app.html"
    ></iframe>
  </body>
</html>
