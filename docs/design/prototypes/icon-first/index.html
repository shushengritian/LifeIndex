<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; frame-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>LifeIndex · 图标化操作设计 R1.1</title>
    <link rel="stylesheet" href="review.css" />
    <script src="review.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <h1>LifeIndex · 操作重设计</h1>
        <p>设计提案 R1.1 · 合成数据 · 不连接正式 APP · 刷新重置</p>
      </div>
    </header>
    <main>
      <aside>
        <h2>内容做入口，图标做动作。</h2>
        <p>
          专注借鉴番茄 TODO
          的准备与沉浸计时分离；记账、健康取消独立文字操作按钮，保持字段与数据清晰可读。
        </p>
        <label
          >页面<select id="view">
            <option value="focus">专注 · 准备</option>
            <option value="running">专注 · 运行</option>
            <option value="today">今天</option>
            <option value="finance">记账</option>
            <option value="entry">记账 · 录入</option>
            <option value="report">记账 · 报表</option>
            <option value="health">健康</option>
          </select></label
        >
        <label
          >主题<select id="theme">
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select></label
        >
        <label
          >画布<select id="size">
            <option value="390,844">390 × 844</option>
            <option value="320,568">320 × 568</option>
            <option value="430,932">430 × 932</option>
          </select></label
        >
        <p class="note">
          可操作：底栏导航、日历选日、录入与模拟保存、健康新增与详情、完整计时与结束确认。没有接入真实数据、后台恢复或系统键盘验证。设置不属于本轮改稿。
        </p>
        <p class="note">
          请重点审核：完整圆环、统一操作组、录入工具栏。破坏性确认保留文字，避免误操作。
        </p>
      </aside>
      <div class="preview">
        <iframe
          id="app"
          title="LifeIndex 图标化交互原型"
          sandbox="allow-scripts allow-forms"
          src="app.html?view=focus&amp;theme=light"
        ></iframe>
      </div>
    </main>
  </body>
</html>
