<!doctype html>
<html lang="zh-CN">

    <style>
      * {
        box-sizing: border-box;
      }
      body {

        padding: 20px;

        color: #172c46;
        background: #e7edf3;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        max-width: 65ch;

    <label
