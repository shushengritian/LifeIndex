<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LifeIndex · 三种完成方式</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ebe4d9;
        color: #2d2435;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      }
      main {
        max-width: 1290px;
        padding: 32px 24px 48px;
        margin: auto;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 3vw, 42px);
        letter-spacing: -0.035em;
      }
      .intro {
        max-width: 720px;
        color: #62556b;
        line-height: 1.7;
        margin-bottom: 28px;
      }
      .options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      h2 {
        margin: 0;
        font-size: 22px;
      }
      a {
        color: inherit;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
      }
      a:focus-visible {
        outline: 3px solid #b53b1e;
        outline-offset: 4px;
      }
      .option p {
        margin: 8px 0 18px;
        min-height: 70px;
        line-height: 1.65;
        font-size: 14px;
        color: #62556b;
      }
      iframe {
        display: block;
        border: 1px solid #c5b9c8;
        border-radius: 18px;
        width: 100%;
        height: 844px;
        background: #f5f0e8;
      }
      footer {
        margin-top: 28px;
        font-size: 14px;
        line-height: 1.7;
        color: #62556b;
      }
      @media (max-width: 1000px) {
        .options {
          grid-template-columns: 1fr;
        }
        .option {
          max-width: 430px;
          margin: 0 auto 24px;
          width: 100%;
        }
        .option p {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>完成一件事，可以不只是打勾。</h1>
      <p class="intro">
        三个可以直接操作的完整页面。同一份合成数据，不同的动作区域与完成反馈。点习惯、撤销，再试试“留一笔”；每个方案都能用键盘。
      </p>
      <div class="options">
        <section class="option">
          <h2><a href="./?controls=surface&review=0">整行回应</a></h2>
          <p>整条习惯成为动作面，点按后整行显现完成状态。详情单独保留，动作范围更宽。</p>
          <iframe title="整行回应，完整可操作页面" src="./?controls=surface&review=0"></iframe>
        </section>
        <section class="option">
          <h2><a href="./?controls=paper&review=0">完成纸签</a></h2>
          <p>“做到了”是动作，“已记下”是回执。纸签从实色变为留痕，习惯标题继续负责查看。</p>
          <iframe title="完成纸签，完整可操作页面" src="./?controls=paper&review=0"></iframe>
        </section>
        <section class="option">
          <h2><a href="./?controls=slide&review=0">轻推留痕</a></h2>
          <p>向右轻推留下完成记录，也可直接点按。垂直滚动和半途放手不会误记。</p>
          <iframe title="轻推留痕，完整可操作页面" src="./?controls=slide&review=0"></iframe>
        </section>
      </div>
      <footer>
        交互研究稿 · 内存合成数据，刷新会重置。尚未定稿、尚未部署；真实设备手势体验仍待验证。
      </footer>
    </main>
  </body>
</html>
